<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>FinanceBook Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/financebook_icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img src="assets/financebook_icon.png"><span>Finance<span class="accent">Book</span></span></div>
    <nav id="mainNav"></nav>
    <div class="sidebar-bottom">
      <div class="sync-card"><div class="sync-icon">☁</div><strong>Свързано с приложението</strong><span id="syncText">Проверка…</span><div class="sync-ok">✓ Offline-first синхронизация</div></div>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <div class="search">⌕ <input id="searchInput" placeholder="Търсене..."></div>
      <div class="top-actions"><button class="icon-btn" title="Сигнали" onclick="go('alerts')">♢</button><button class="icon-btn" title="Календар" onclick="go('calendar')">▣</button><div class="profile-anchor"><button class="user user-btn" id="profileBtn" title="Профил"><div class="avatar" id="avatarText">Г</div><div><b id="profileNameTop">Галин</b><small id="profilePlanTop">FinanceBook Pro</small></div><span class="profile-chevron">⌄</span></button><div class="profile-menu hidden" id="profileMenu"></div></div></div>
    </header>

    <section id="view"></section>
  </main>
</div>

<div class="mobile-nav" id="mobileNav"></div>
<div class="toast" id="toast"></div>

<div class="auth-overlay hidden" id="authOverlay">
  <div class="auth-card">
    <div class="auth-brand"><img src="assets/financebook_icon.png"><div><strong>FinanceBook Pro</strong><span>Сигурен достъп до личните финанси</span></div></div>
    <div class="auth-tabs"><button class="active" id="loginTab" type="button">Вход</button><button id="registerTab" type="button">Регистрация</button></div>
    <form id="loginForm" class="auth-form">
      <label>Имейл или admin<input name="email" autocomplete="username" required placeholder="name@example.com"></label>
      <label>Парола<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Вход</button>
      <button class="link-btn" id="forgotPasswordBtn" type="button">Забравена парола?</button>
      <p class="auth-hint" id="authModeHint">Свързване с Firebase…</p>
    </form>
    <form id="registerForm" class="auth-form hidden">
      <div class="auth-two"><label>Име<input name="name" required></label><label>Имейл<input name="email" type="email" required></label></div>
      <div class="auth-two"><label>Телефон<input name="phone" type="tel"></label><label>Държава<input name="country" value="България"></label></div>
      <label>Град<input name="city"></label>
      <label>Парола<input name="password" type="password" minlength="6" required></label>
      <label>Повтори паролата<input name="password2" type="password" minlength="6" required></label>
      <label class="auth-check"><input name="terms" type="checkbox" required> Приемам условията за използване и политиката за поверителност.</label>
      <button class="primary" type="submit">Създай профил</button>
    </form>
    <div class="auth-error" id="authError"></div>
  </div>
</div>
<dialog id="formDialog" class="form-dialog"><form method="dialog" id="entityForm"><div class="dialog-head"><h3 id="dialogTitle">Добави</h3><button value="cancel" class="close-btn">×</button></div><div id="formFields" class="form-grid"></div><div class="dialog-actions"><button value="cancel" class="secondary">Отказ</button><button type="submit" value="default" class="primary">Запази</button></div></form></dialog>

<template id="dashboardTemplate">
  <div class="page-head"><div><h1>Добре дошъл 👋</h1><p>Преглед на личните финанси</p></div><select><option>Изглед: Месец</option></select></div>
  <div class="kpi-grid" id="kpis"></div>
  <div class="quick-actions">
    <button data-go="transactions">＋ Операция</button><button id="dashTransfer">⇄ Трансфер</button><button data-go="accounts">▣ Сметка</button>
    <button data-go="planning">⌂ Битова / План</button><button data-go="planning">◎ Цел</button><button data-go="forecast">↗ Прогноза</button><button data-go="insights">✦ Анализ</button>
  </div>
  <div class="dashboard-grid">
    <div class="panel"><div class="panel-head"><h3>Моите сметки</h3><button data-go="accounts">Всички сметки</button></div><div id="accountsMini"></div></div>
    <div class="panel"><div class="panel-head"><h3>Последни операции</h3><button data-go="transactions">Всички</button></div><div id="transactionsMini"></div></div>
    <div class="panel"><div class="panel-head"><h3>Предстоящи задължения</h3><button data-go="debts">Всички</button></div><div id="debtsMini"></div><div class="panel-total">Общо дължими: <b id="debtsTotal"></b></div></div>
    <div class="panel"><div class="panel-head"><h3>Бюджети</h3><button data-go="budgets">Всички бюджети</button></div><div id="budgetsMini"></div></div>
    <div class="panel stats-panel"><div class="panel-head"><h3>Статистика</h3><button data-go="statistics">Отчети</button></div><canvas id="statsCanvas" width="460" height="220"></canvas></div>
    <div class="panel"><div class="panel-head"><h3>Свързани карти и банки</h3><button data-go="accounts">Управление</button></div><div id="cardsMini"></div></div>
  </div>
</template>
<script type="module" src="js/app-v201.js?v=201"></script>
</body>
</html>
