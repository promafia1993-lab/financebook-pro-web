<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>FinanceBook Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/financebook_icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img src="assets/financebook_icon.png"><span>Finance<span class="accent">Book</span></span></div>
    <nav id="mainNav"></nav>
    <div class="sidebar-bottom">
      <div class="sync-card"><div class="sync-icon">☁</div><strong>Свързано с приложението</strong><span id="syncText">Демо режим</span><div class="sync-ok">✓ Всичко е актуално</div></div>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <div class="search">⌕ <input id="searchInput" placeholder="Търсене..."></div>
      <div class="top-actions"><button class="icon-btn">♢</button><button class="icon-btn">▣</button><div class="user"><div class="avatar">Г</div><div><b>Галин</b><small>FinanceBook Pro</small></div></div></div>
    </header>

    <section id="view"></section>
  </main>
</div>

<div class="mobile-nav" id="mobileNav"></div>
<div class="toast" id="toast"></div>

<template id="dashboardTemplate">
  <div class="page-head"><div><h1>Добре дошъл 👋</h1><p>Преглед на личните финанси</p></div><select><option>Изглед: Месец</option></select></div>
  <div class="kpi-grid" id="kpis"></div>
  <div class="dashboard-grid">
    <div class="panel"><div class="panel-head"><h3>Моите сметки</h3><button data-go="accounts">Всички сметки</button></div><div id="accountsMini"></div></div>
    <div class="panel"><div class="panel-head"><h3>Последни операции</h3><button data-go="transactions">Всички</button></div><div id="transactionsMini"></div></div>
    <div class="panel"><div class="panel-head"><h3>Предстоящи задължения</h3><button data-go="debts">Всички</button></div><div id="debtsMini"></div><div class="panel-total">Общо дължими: <b id="debtsTotal"></b></div></div>
    <div class="panel"><div class="panel-head"><h3>Бюджети</h3><button data-go="budgets">Всички бюджети</button></div><div id="budgetsMini"></div></div>
    <div class="panel stats-panel"><div class="panel-head"><h3>Статистика</h3><button data-go="statistics">Отчети</button></div><canvas id="statsCanvas" width="460" height="220"></canvas></div>
    <div class="panel"><div class="panel-head"><h3>Свързани карти и банки</h3><button data-go="accounts">Управление</button></div><div id="cardsMini"></div></div>
  </div>
</template>
<script type="module" src="js/app.js"></script>
</body>
</html>
